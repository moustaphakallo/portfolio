<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  * {{ margin: 0; padding: 0; box-sizing: border-box; }}
  body {{
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }}
  .card {{
    width: 500px;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.8);
  }}
  .photo {{
    width: 100%;
    display: block;
  }}
  .caption {{
    background: #000;
    padding: 24px 28px 28px;
    text-align: center;
    border-top: 3px solid #00cc66;
  }}
  .titre {{
    font-family: Georgia, serif;
    font-size: 22px;
    font-weight: bold;
    color: #ffffff;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }}
  .sous-titre {{
    font-family: Georgia, serif;
    font-size: 14px;
    color: #00cc66;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }}
  .texte {{
    font-family: Georgia, serif;
    font-size: 13px;
    color: #aaaaaa;
    line-height: 1.8;
    font-style: italic;
  }}
  .ligne {{
    width: 60px;
    height: 2px;
    background: #00cc66;
    margin: 14px auto;
  }}
</style>
